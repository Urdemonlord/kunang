<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunang — Penjaga Lentera</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05081a;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    overflow: hidden;
    user-select: none;
  }
  /* Responsive shell (responsive-canvas-game): the canvas keeps its 16:9
     frame and scales to the viewport; the drawing size stays logical
     1280x720, the backing store is DPR-aware (see main.js fitCanvas). */
  canvas {
    display: block;
    width: min(1280px, 100vw, calc(100dvh * 16 / 9));
    aspect-ratio: 16 / 9;
    height: auto;
    max-height: 100dvh;
    cursor: crosshair;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
